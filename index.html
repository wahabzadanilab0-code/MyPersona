<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyPersona</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

:root {
    --accent: #b99a68;
    --accent-light: #e0c99d;
    --text: #f1e9d8;
    --muted: #b7b3a4;
    --border: rgba(185, 154, 104, .25);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(ellipse at 12% 12%, rgba(74, 119, 105, .34), transparent 42%),
        radial-gradient(ellipse at 88% 86%, rgba(111, 139, 111, .24), transparent 45%),
        linear-gradient(135deg, #111f20 0%, #172829 52%, #203536 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 18px;
    color: var(--text);
}

.container {
    width: 1050px;
    max-width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
}

.form-box {
    padding: 35px;
    border-radius: 25px;
    background: linear-gradient(145deg, #263b38, #1d302f);
    border: 1px solid rgba(185,154,104,.24);
    backdrop-filter: blur(18px);
    box-shadow: 0 18px 48px rgba(0,0,0,.28);
}

.form-header {
    text-align: center;
    margin-bottom: 30px;
}

.form-header .icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    margin: 0 auto 12px;
    border: 1px solid rgba(185,154,104,.30);
    border-radius: 16px;
    background: linear-gradient(145deg, rgba(185,154,104,.18), rgba(185,154,104,.06));
    color: var(--accent);
    font-size: 25px;
}

.form-header h2 {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #8b7048, #d8bd8a, #8b7048);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.form-header p {
    color: var(--muted);
    font-size: 12px;
    margin-top: 7px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 100px;
    gap: 9px;
    margin-bottom: 13px;
}

.form-row input {
    width: 100%;
    min-width: 0;
    padding: 11px 9px;
    border-radius: 9px;
    outline: none;
    font-size: 12px;
    transition: .3s;
}

.form-row input:first-child {
    background: #192c2b;
    border: 1px solid rgba(185,154,104,.26);
    color: #f1e9d8;
}

.form-row input:last-child {
    background: rgba(214,183,122,.075);
    border: 1px solid rgba(214,183,122,.27);
    color: var(--accent);
    text-align: center;
}

.form-row input::placeholder {
    color: #8d9a8e;
}

.form-row input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(185,154,104,.14);
    background: #223735;
}

.submit-btn {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(120deg, #94774d, #d8bd8a, #94774d);
    color: #172523;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .3s;
}

.submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(0,0,0,.28);
}

.submit-btn:active {
    transform: scale(.98);
}

.result-box {
    padding: 38px 28px;
    border-radius: 25px;
    background: linear-gradient(145deg, #142625, #29413c);
    border: 1px solid rgba(185,154,104,.28);
    backdrop-filter: blur(18px);
    box-shadow: 0 18px 48px rgba(0,0,0,.30);
    min-height: 480px;
}

.result-header {
    text-align: center;
    margin-bottom: 35px;
}

.result-header .crown {
    width: 54px;
    height: 54px;
    display: grid;
    place-items: center;
    margin: 0 auto 12px;
    border-radius: 18px;
    border: 1px solid rgba(185,154,104,.30);
    background: linear-gradient(145deg, rgba(185,154,104,.18), rgba(185,154,104,.06));
    color: var(--accent);
    font-size: 27px;
}

.result-header h2 {
    color: var(--accent);
    font-size: 24px;
    letter-spacing: .8px;
}

.result-header p {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1px;
    margin-top: 6px;
}

.result-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 15px 12px;
    margin-bottom: 12px;
    background: rgba(0,0,0,.13);
    border: 1px solid rgba(185,154,104,.16);
    border-left: 3px solid #b99a68;
    border-radius: 10px;
    font-size: 13px;
    animation: appear .5s ease both;
}

.result-item strong {
    color: var(--accent);
    flex-shrink: 0;
}

.result-item span {
    text-align: right;
    overflow-wrap: anywhere;
}

.empty-message {
    text-align: center;
    color: #c5c4b7;
    margin-top: 80px;
    line-height: 2;
    font-size: 13px;
}

#message {
    text-align: center;
    color: var(--accent);
    font-size: 12px;
    margin-top: 15px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width: 750px) {
    .container {
        grid-template-columns: 1fr;
    }

    .form-box,
    .result-box {
        padding: 25px 18px;
    }
}

@media(max-width: 360px) {
    .form-row {
        grid-template-columns: 1fr 85px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- FORM SECTION -->
    <form class="form-box" id="myForm" novalidate>

        <div class="form-header">
            <div class="icon" aria-hidden="true">✧</div>
            <h2>PERSONAL PROFILE</h2>
            <p>Enter Your Information Below</p>
        </div>

        <div class="form-row">
            <input type="text" id="name" placeholder="Name">
            <input type="text" id="nameColor" placeholder="Color">
        </div>

        <div class="form-row">
            <input type="text" id="lastName" placeholder="Last Name">
            <input type="text" id="lastColor" placeholder="Color">
        </div>

        <div class="form-row">
            <input type="email" id="email" placeholder="Email">
            <input type="text" id="emailColor" placeholder="Color">
        </div>

        <div class="form-row">
            <input type="text" id="country" placeholder="Country">
            <input type="text" id="countryColor" placeholder="Color">
        </div>

        <div class="form-row">
            <input type="number" id="age" placeholder="Age">
            <input type="text" id="ageColor" placeholder="Color">
        </div>

        <div class="form-row">
            <input type="text" id="education" placeholder="Education">
            <input type="text" id="educationColor" placeholder="Color">
        </div>

        <div class="form-row">
            <input type="text" id="job" placeholder="Job">
            <input type="text" id="jobColor" placeholder="Color">
        </div>

        <button type="submit" class="submit-btn">✧ SUBMIT ✧</button>

        <p id="message" aria-live="polite"></p>

    </form>

    <!-- RESULT SECTION -->
    <div class="result-box">

        <div class="result-header">
            <div class="crown" aria-hidden="true">◇</div>
            <h2>MY PROFILE</h2>
            <p>YOUR PERSONAL INFORMATION</p>
        </div>

        <div id="result" aria-live="polite">
            <div class="empty-message">
                Your information will appear here.<br>
                Complete the form and click Submit.
            </div>
        </div>

    </div>

</div>

<script>

const form = document.getElementById("myForm");

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const fields = [
        {
            label: "Name",
            value: document.getElementById("name").value,
            color: document.getElementById("nameColor").value
        },
        {
            label: "Last Name",
            value: document.getElementById("lastName").value,
            color: document.getElementById("lastColor").value
        },
        {
            label: "Email",
            value: document.getElementById("email").value,
            color: document.getElementById("emailColor").value
        },
        {
            label: "Country",
            value: document.getElementById("country").value,
            color: document.getElementById("countryColor").value
        },
        {
            label: "Age",
            value: document.getElementById("age").value,
            color: document.getElementById("ageColor").value
        },
        {
            label: "Education",
            value: document.getElementById("education").value,
            color: document.getElementById("educationColor").value
        },
        {
            label: "Job",
            value: document.getElementById("job").value,
            color: document.getElementById("jobColor").value
        }
    ];

    let output = "";

    fields.forEach(function(item, index) {

        if (item.value.trim() !== "") {

            let color = item.color.trim();

            if (!color || !CSS.supports("color", color)) {
                color = "#f5f0e8";
            }

            output += `
                <div class="result-item"
                     style="animation-delay:${index * 0.08}s">

                    <strong>${escapeHTML(item.label)}</strong>

                    <span style="color:${escapeHTML(color)}">
                        ${escapeHTML(item.value)}
                    </span>

                </div>
            `;
        }

    });

    document.getElementById("result").innerHTML = output || `
        <div class="empty-message">
            Please enter your information!
        </div>
    `;

    document.getElementById("message").textContent =
        "✧ Profile Updated Successfully ✧";

});


function escapeHTML(text) {

    return text.replace(/[&<>"']/g, function(char) {

        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];

    });

}

</script>

</body>
</html>
